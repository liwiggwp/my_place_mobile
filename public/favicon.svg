<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rounded Squircle Background (iOS App Icon Shape) -->
  <rect width="512" height="512" rx="120" fill="#ffffff" />
  
  <!-- Subtle border -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#e2e8f0" stroke-width="12" />

  <!-- Monogram MP in #203A5F and #595959 -->
  <g transform="translate(100, 110) scale(3.2)">
    <!-- Letter 'M' in Deep Navy Blue #203A5F -->
    <path
